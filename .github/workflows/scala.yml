# separate terms of service, privacy policy, and support
# documentation.

name: Scala CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  cli-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
    - name: Run CLI tests
      run: bash tests/tacit_test.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Run tests
      run: sbt test
    - name: Set up Scala CLI
      uses: VirtusLab/scala-cli-setup@v1
    - name: Run library tests
      # --server=false: Scala 3 nightlies from 2026-08-12 on depend on upstream
      # ASM 9.10.1 (org.ow2.asm) instead of the scala-asm fork, which the
      # Bloop server bundled with scala-cli (Bloop 2.0.19, ASM 9.9.1) shadows;
      # compiling through Bloop then fails with a NoClassDefFoundError in the
      # backend. Plain scalac has no such conflict.
      run: cd library && scala-cli test . --server=false

  publish-release:
    if: github.event_name == 'release'
    needs: [build, cli-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Build server and library JARs
      run: |
        chmod +x build.sh
        ./build.sh --verbose dist
    - name: Upload JARs to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" \
          dist/TACIT-library.jar \
          dist/TACIT.jar \
          --clobber
